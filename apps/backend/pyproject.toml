[project]
name = "visa-sponsor-api"
version = "0.1.0"
description = "FastAPI backend and ETL pipeline for VisaSponsor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.2",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "redis>=5.0.8",
    "rapidfuzz>=3.9.6",
    "PyJWT[crypto]>=2.9.0",
    "orjson>=3.10.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.2",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
